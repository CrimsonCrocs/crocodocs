<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 180" role="img" aria-labelledby="title desc">
  <title id="title">How a Git change reaches the team</title>
  <desc id="desc">Edit a file, stage the intended change, commit it locally, then push the commit to the shared remote repository.</desc>
  <rect width="830" height="180" rx="18" fill="#f1f5f9"/>
  <g fill="#fff" stroke="#16a34a" stroke-width="2">
    <rect x="20" y="42" width="165" height="96" rx="12"/>
    <rect x="225" y="42" width="165" height="96" rx="12"/>
    <rect x="430" y="42" width="165" height="96" rx="12"/>
    <rect x="635" y="42" width="175" height="96" rx="12"/>
  </g>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g fill="#0f172a" font-size="18" font-weight="bold">
      <text x="102" y="80">1. Edit</text><text x="307" y="80">2. Stage</text>
      <text x="512" y="80">3. Commit</text><text x="722" y="80">4. Push</text>
    </g>
    <g fill="#334155" font-size="14">
      <text x="102" y="107">working files</text><text x="307" y="107">chosen changes</text>
      <text x="512" y="107">local history</text><text x="722" y="107">shared remote</text>
    </g>
  </g>
  <g fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M190 90h26m-8-8 8 8-8 8"/>
    <path d="M395 90h26m-8-8 8 8-8 8"/>
    <path d="M600 90h26m-8-8 8 8-8 8"/>
  </g>
</svg>
