<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
<title id="title">Overhung and straddle-supported loads</title><desc id="desc">Left: a wheel beyond one bearing creates a bending moment at the support. Right: a wheel between two bearings transfers the applied load into both supports.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b42629"/></marker></defs>
<rect width="800" height="330" rx="12" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif" font-size="20">
<text x="24" y="36" font-size="23">Bearing placement changes the load path</text>
<text x="35" y="79" font-size="20">Overhung load</text><text x="435" y="79" font-size="20">Load between supports</text>
<line x1="55" y1="180" x2="335" y2="180" stroke="#242424" stroke-width="3" /><line x1="440" y1="180" x2="755" y2="180" stroke="#242424" stroke-width="3" />
<rect x="96" y="128" width="30" height="104" fill="#e8e8e8" stroke="#242424" stroke-width="3"/>
<rect x="475" y="128" width="30" height="104" fill="#e8e8e8" stroke="#242424" stroke-width="3"/>
<rect x="695" y="128" width="30" height="104" fill="#e8e8e8" stroke="#242424" stroke-width="3"/>
<rect x="260" y="140" width="44" height="80" rx="8" fill="#fbe6e6" stroke="#b42629" stroke-width="3"/>
<rect x="580" y="140" width="44" height="80" rx="8" fill="#fbe6e6" stroke="#b42629" stroke-width="3"/>
<line x1="282" y1="90" x2="282" y2="130" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/><line x1="602" y1="90" x2="602" y2="130" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/>
<text x="268" y="87" font-size="20">F</text><text x="588" y="87" font-size="20">F</text><text x="65" y="265" font-size="18">Moment at support = F × d</text>
<line x1="111" y1="113" x2="282" y2="113" stroke="#b42629" stroke-width="3" /><text x="188" y="104" font-size="18">d</text>
<text x="452" y="265" font-size="18">Both supports carry reaction loads</text>
</g>
