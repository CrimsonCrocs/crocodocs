<svg xmlns="http://www.w3.org/2000/svg" width="800" height="330" viewBox="0 0 800 330" role="img" aria-labelledby="title desc">
<title id="title">Object control during a handoff</title><desc id="desc">Donor holding progresses to shared capture and then receiver holding. If capture is not established, a recovery path returns to donor control rather than releasing the object.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b42629"/></marker></defs>
<rect width="800" height="330" rx="12" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif" font-size="20">
<text x="24" y="36" font-size="23">Control must continue through the handoff</text>
<g fill="#f5f5f5" stroke="#242424" stroke-width="2"><rect x="35" y="95" width="200" height="70" rx="8"/><rect x="295" y="95" width="210" height="70" rx="8"/><rect x="565" y="95" width="200" height="70" rx="8"/></g>
<text x="66" y="138" font-size="20">Donor holds</text><text x="327" y="138" font-size="20">Shared capture</text><text x="581" y="138" font-size="20">Receiver holds</text>
<line x1="240" y1="130" x2="285" y2="130" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/><line x1="510" y1="130" x2="555" y2="130" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/>
<text x="43" y="195" font-size="17">Align and capture</text><text x="521" y="195" font-size="17">Confirm, then release</text>
<path d="M400 170V245H135V175" stroke="#b42629" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="207" y="275" font-size="18">Failed capture: recover to a known state</text>
</g>
<text x="24" y="313" font-family="Arial, sans-serif" font-size="14" fill="#555">CrocoDocs · Original illustration · Not to scale</text></svg>
