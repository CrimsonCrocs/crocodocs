<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title desc">
<title id="title">Gravity loads on a horizontal arm</title><desc id="desc">A pivot at the left supports a horizontal arm. Arm weight acts at its center, and payload weight acts at the end. Their horizontal distances are the moment arms.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#b42629"/></marker></defs>
<rect width="800" height="350" rx="12" fill="#fff"/>
<g fill="#242424" font-family="Arial, sans-serif" font-size="20">
<text x="24" y="36" font-size="23">Horizontal arm: two contributions to gravity torque</text>
<path d="M75 215L105 155L135 215Z" fill="#e8e8e8" stroke="#242424" stroke-width="3"/>
<rect x="105" y="143" width="540" height="24" rx="4" fill="#dedede" stroke="#242424" stroke-width="3"/>
<circle cx="105" cy="155" r="12" fill="#fff" stroke="#242424" stroke-width="3"/>
<rect x="613" y="105" width="64" height="62" fill="#fbe6e6" stroke="#b42629" stroke-width="3"/>
<line x1="375" y1="165" x2="375" y2="230" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/><line x1="645" y1="170" x2="645" y2="260" stroke="#b42629" stroke-width="3" marker-end="url(#arrow)"/>
<text x="285" y="255" font-size="18">Arm weight</text><text x="552" y="285" font-size="18">Payload weight</text>
<line x1="105" y1="75" x2="375" y2="75" stroke="#b42629" stroke-width="3" /><line x1="105" y1="65" x2="105" y2="85" stroke="#b42629" stroke-width="3" /><line x1="375" y1="65" x2="375" y2="85" stroke="#b42629" stroke-width="3" />
<text x="185" y="63" font-size="18">L / 2</text><text x="48" y="245" font-size="18">Pivot</text>
<line x1="105" y1="95" x2="645" y2="95" stroke="#b42629" stroke-width="3" /><line x1="645" y1="85" x2="645" y2="105" stroke="#b42629" stroke-width="3" /><text x="485" y="82" font-size="18">L</text>
</g>
<text x="24" y="333" font-family="Arial, sans-serif" font-size="14" fill="#555">CrocoDocs · Original illustration · Not to scale</text></svg>
