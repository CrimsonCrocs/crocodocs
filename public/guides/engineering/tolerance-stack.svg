<g stroke="#242424" stroke-width="3"><rect x="100" y="90" width="200" height="85" fill="#ededed"/><rect x="300" y="90" width="200" height="85" fill="#fbe6e6"/><rect x="500" y="90" width="200" height="85" fill="#ededed"/></g>
<text x="125" y="141" font-size="18">10.0 ± 0.1 mm</text><text x="325" y="141" font-size="18">10.0 ± 0.1 mm</text><text x="525" y="141" font-size="18">10.0 ± 0.1 mm</text>
<line x1="100" y1="215" x2="700" y2="215" stroke="#b42629" stroke-width="3" /><line x1="100" y1="200" x2="100" y2="230" stroke="#b42629" stroke-width="3" /><line x1="700" y1="200" x2="700" y2="230" stroke="#b42629" stroke-width="3" />
<text x="272" y="253" font-size="23">30.0 ± 0.3 mm total</text>
