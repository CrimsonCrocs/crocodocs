<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 170" role="img" aria-labelledby="title desc">
  <title id="title">BIOBUZZ match timeline</title>
  <desc id="desc">Autonomous lasts 30 seconds, followed by an 8-second transition and 2 minutes of driver-controlled teleoperated play.</desc>
  <rect width="850" height="170" rx="18" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#fff">
    <rect x="25" y="34" width="224" height="82" rx="12" fill="#1d4ed8"/>
    <rect x="254" y="34" width="132" height="82" rx="12" fill="#64748b"/>
    <rect x="391" y="34" width="434" height="82" rx="12" fill="#dc2626"/>
    <g font-size="20" font-weight="bold">
      <text x="137" y="70">AUTO</text><text x="320" y="70">Transition</text><text x="608" y="70">TELEOP</text>
    </g>
    <g font-size="16">
      <text x="137" y="96">30 seconds</text><text x="320" y="96">8 seconds</text><text x="608" y="96">2 minutes</text>
    </g>
  </g>
  <text x="137" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Robot runs its program</text>
  <text x="608" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">Drivers control the robot</text>
</svg>
