<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Aim from the turret pivot</title><desc id="desc">The robot reference is (24, 24) inches at a heading of 90 degrees. A robot-relative pivot offset of 6 inches forward and 2 inches left becomes a field pivot at (22, 30). A target at (46, 54) has a 45-degree field bearing, requiring minus 45 degrees relative to the robot nose.</desc>
<defs><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#242424"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b42629"/></marker></defs>
<rect width="800" height="480" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="24" fill="#242424">Aim from the turret pivot</text>
<text x="24" y="65" font-size="18" fill="#242424">Distances in inches · heading is counterclockwise from field +X</text>
<rect x="232" y="276" width="96" height="128" rx="12" fill="#eee" stroke="#aaa" stroke-width="2"/>
<line x1="280" y1="340" x2="280" y2="242" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="297" y="254" font-size="17" fill="#242424">Robot forward</text>
<path d="M280 340L280 292L264 292" fill="none" stroke="#666" stroke-width="2" stroke-dasharray="5 4"/>
<circle cx="280" cy="340" r="5" fill="#242424"/>
<text x="294" y="362" font-size="18" fill="#242424">Reference (24, 24)</text>
<line x1="264" y1="292" x2="456" y2="100" stroke="#b42629" stroke-width="3" marker-end="url(#red)"/>
<circle cx="264" cy="292" r="6" fill="#b42629"/>
<text x="92" y="294" font-size="18" fill="#b42629">Pivot (22, 30)</text>
<circle cx="456" cy="100" r="6" fill="#b42629"/>
<text x="475" y="106" font-size="18" fill="#b42629">Target (46, 54)</text>
<line x1="271" y1="292" x2="360" y2="292" stroke="#666" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M312 292A48 48 0 0 0 298 258" fill="none" stroke="#b42629" stroke-width="2"/>
<text x="338" y="277" font-size="19" fill="#b42629">β = 45°</text>
<text x="514" y="201" font-size="18" fill="#242424">Pivot offset in robot frame:</text>
<text x="514" y="231" font-size="20" fill="#242424">6 forward, 2 left</text>
<text x="514" y="277" font-size="18" fill="#242424">Chassis heading: θ = 90°</text>
<text x="514" y="307" font-size="18" fill="#242424">Turret zero: α₀ = 0°</text>
<text x="514" y="350" font-size="21" fill="#b42629">q = 45° − 90° = −45°</text>
<text x="514" y="379" font-size="17" fill="#242424">Clockwise from the nose</text>
<line x1="100" y1="417" x2="100" y2="341" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="89" y="326" font-size="18" fill="#242424">+Y</text>
<line x1="100" y1="417" x2="192" y2="417" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="202" y="424" font-size="18" fill="#242424">+X</text>
</g>
<text x="24" y="463" font-size="14" fill="#666">CrocoDocs · Original illustration · Top view</text>
</svg>
