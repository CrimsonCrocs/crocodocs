<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" font-family="Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">One request, two coordinate frames</title><desc id="desc">A robot faces field positive Y, at a heading of 90 degrees. The requested field translation (1, 0) points to robot right and is expressed as (0, -1) in forward-left robot coordinates.</desc>
<defs><marker id="ink" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#242424"/></marker><marker id="red" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#b42629"/></marker></defs>
<rect width="800" height="430" rx="12" fill="#fff"/>
<g font-family="Arial, sans-serif">
<text x="24" y="34" font-size="24" fill="#242424">One request, two coordinate frames</text>
<text x="24" y="65" font-size="18" fill="#242424">Robot heading: +90° · the red arrow keeps the same physical direction</text>
<text x="65" y="109" font-size="21" fill="#242424">Field coordinates</text>
<rect x="135" y="233" width="50" height="74" rx="8" fill="#eee" stroke="#aaa"/>
<path d="M153 248L160 237L167 248" fill="none" stroke="#666" stroke-width="2"/>
<line x1="160" y1="280" x2="160" y2="146" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="173" y="155" font-size="20" fill="#242424">+Y</text>
<line x1="160" y1="280" x2="316" y2="280" stroke="#b42629" stroke-width="3" marker-end="url(#red)"/><text x="284" y="311" font-size="20" fill="#242424">+X</text>
<text x="91" y="350" font-size="22" fill="#242424">(x_f, y_f) = (1, 0)</text>
<line x1="400" y1="100" x2="400" y2="371" stroke="#ddd" stroke-width="2"/>
<text x="468" y="109" font-size="21" fill="#242424">Robot coordinates</text>
<rect x="535" y="233" width="50" height="74" rx="8" fill="#eee" stroke="#aaa"/>
<path d="M553 248L560 237L567 248" fill="none" stroke="#666" stroke-width="2"/>
<line x1="560" y1="280" x2="560" y2="146" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="578" y="155" font-size="18" fill="#242424">+X forward</text>
<line x1="560" y1="280" x2="432" y2="280" stroke="#242424" stroke-width="3" marker-end="url(#ink)"/><text x="421" y="253" font-size="18" fill="#242424">+Y left</text>
<line x1="560" y1="280" x2="716" y2="280" stroke="#b42629" stroke-width="3" marker-end="url(#red)"/><text x="655" y="311" font-size="18" fill="#b42629">Right</text>
<text x="489" y="350" font-size="22" fill="#242424">(x_r, y_r) = (0, −1)</text>
<text x="180" y="387" font-size="17" fill="#242424">Same physical direction · rotate the coordinates by −90°</text>
</g>
<text x="24" y="413" font-size="14" fill="#666">CrocoDocs · Original illustration · Top view</text>
</svg>
