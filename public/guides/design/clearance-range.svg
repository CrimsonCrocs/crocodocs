<svg xmlns="http://www.w3.org/2000/svg" width="600" height="450" viewBox="0 0 600 450" role="img" aria-labelledby="title desc"><title id="title">A nominal clearance with possible interference</title><desc id="desc">An opening of 10.00 plus or minus 0.15 mm and a tab of 9.80 plus or minus 0.15 mm can have clearance from minus 0.10 to plus 0.50 mm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="450" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">Nominal clearance can disappear</text><text x="30" y="93" font-size="22" text-anchor="start" >Opening: 10.00 ± 0.15 mm</text><text x="30" y="130" font-size="22" text-anchor="start" >Tab: 9.80 ± 0.15 mm</text><line x1="90" y1="267" x2="550" y2="267" stroke="#77766f" stroke-width="2" /><line x1="110" y1="267" x2="170" y2="267" stroke="#b82730" stroke-width="2" style="stroke-width:9"/><line x1="170" y1="267" x2="470" y2="267" stroke="#77766f" stroke-width="2" style="stroke-width:9"/><line x1="110" y1="255" x2="110" y2="280" stroke="#77766f" stroke-width="2" /><line x1="170" y1="255" x2="170" y2="280" stroke="#77766f" stroke-width="2" /><line x1="470" y1="255" x2="470" y2="280" stroke="#77766f" stroke-width="2" /><circle cx="110" cy="267" r="6" fill="#b82730" stroke="#b82730" stroke-width="2"/><circle cx="470" cy="267" r="6" fill="#77766f" stroke="#77766f" stroke-width="2"/><text x="110" y="310" font-size="22" text-anchor="middle" >−0.10</text><text x="170" y="310" font-size="22" text-anchor="middle" >0</text><text x="470" y="310" font-size="22" text-anchor="middle" >+0.50</text><text x="30" y="205" font-size="21" text-anchor="start" >Tightest: interference</text><line x1="110" y1="219" x2="110" y2="249" stroke="#77766f" stroke-width="2" /><text x="340" y="205" font-size="21" text-anchor="start" >Loosest: clearance</text><line x1="470" y1="219" x2="470" y2="249" stroke="#77766f" stroke-width="2" /><text x="30" y="373" font-size="22" text-anchor="start" >9.85 − 9.95 = −0.10 mm</text><text x="30" y="416" font-size="22" text-anchor="start" >10.15 − 9.65 = +0.50 mm</text></g></svg>
