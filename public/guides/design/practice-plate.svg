<svg xmlns="http://www.w3.org/2000/svg" width="480" height="330" viewBox="0 0 480 330" role="img" aria-labelledby="title desc">
  <title id="title">Two-hole practice plate</title>
  <desc id="desc">A 70 by 40 millimeter plate with two holes of diameter 4.5 millimeters. The holes lie on the horizontal centerline, 40 millimeters apart, with 15 millimeters from each center to the nearest short edge.</desc>
