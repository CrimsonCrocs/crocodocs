    <text x="456" y="32" font-size="16" text-anchor="end">All dimensions: mm</text>
    <rect x="100" y="88" width="280" height="160" rx="2" fill="#e9e5df" stroke="#43433f" stroke-width="2"/>
    <path d="M86 168H394M240 78V258" stroke="#8b8983" stroke-dasharray="7 5"/>
    <g fill="#faf9f6" stroke="#b82730" stroke-width="2.5"><circle cx="160" cy="168" r="9"/><circle cx="320" cy="168" r="9"/></g>
    <g fill="none" stroke="#696963" stroke-width="1.5">
      <path d="M100 80V51M380 80V51M100 60H380M100 55V65M380 55V65"/>
