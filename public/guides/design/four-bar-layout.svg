<svg xmlns="http://www.w3.org/2000/svg" width="600" height="550" viewBox="0 0 600 550" role="img" aria-labelledby="title desc"><title id="title">Parallelogram at thirty and ninety degrees</title><desc id="desc">Fixed pivots A and B are 80 mm apart. Equal 120 mm arms keep an 80 mm coupler parallel while moving it upward and backward.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="550" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">A parallelogram keeps the angle</text><text x="30" y="76" font-size="19" text-anchor="start" >Pivot-center layout · two poses</text><line x1="90" y1="385" x2="90" y2="145" stroke="#77766f" stroke-width="2" stroke-dasharray="7 5"/><line x1="250" y1="385" x2="250" y2="145" stroke="#77766f" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="145" x2="250" y2="145" stroke="#77766f" stroke-width="2" stroke-dasharray="7 5"/><line x1="90" y1="385" x2="250" y2="385" stroke="#292927" stroke-width="2" /><line x1="90" y1="385" x2="297.8460969082653" y2="265" stroke="#b82730" stroke-width="2" /><line x1="250" y1="385" x2="457.8460969082653" y2="265" stroke="#b82730" stroke-width="2" /><line x1="297.8460969082653" y1="265" x2="457.8460969082653" y2="265" stroke="#b82730" stroke-width="2" /><circle cx="90" cy="385" r="6" fill="#faf9f6" stroke="#292927" stroke-width="2"/><circle cx="250" cy="385" r="6" fill="#faf9f6" stroke="#292927" stroke-width="2"/><circle cx="297.8460969082653" cy="265" r="6" fill="#faf9f6" stroke="#292927" stroke-width="2"/><circle cx="457.8460969082653" cy="265" r="6" fill="#faf9f6" stroke="#292927" stroke-width="2"/><text x="65" y="413" font-size="21" text-anchor="start" >A</text><text x="260" y="413" font-size="21" text-anchor="start" >B</text><text x="294.8460969082653" y="245" font-size="21" text-anchor="start" >C</text><text x="462.8460969082653" y="245" font-size="21" text-anchor="start" >D</text><text x="270" y="151" font-size="21" text-anchor="start" >90° pose</text><text x="350" y="305" font-size="21" text-anchor="start" >30° pose</text><line x1="90" y1="420" x2="90" y2="441" stroke="#77766f" stroke-width="2" /><line x1="250" y1="420" x2="250" y2="441" stroke="#77766f" stroke-width="2" /><line x1="90" y1="438" x2="250" y2="438" stroke="#77766f" stroke-width="2" /><line x1="90" y1="432" x2="90" y2="444" stroke="#77766f" stroke-width="2" /><line x1="250" y1="432" x2="250" y2="444" stroke="#77766f" stroke-width="2" /><rect x="122" y="423" width="96" height="30" fill="#faf9f6"/><text x="170" y="445" font-size="21" text-anchor="middle" >80 mm</text><text x="30" y="483" font-size="21" text-anchor="start" >Both arms: 120 mm</text><text x="30" y="517" font-size="21" text-anchor="start" >Fixed link and coupler: 80 mm each</text></g></svg>
