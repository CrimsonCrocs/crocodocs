<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">Live and dead axle support roles</title><desc id="desc">In the live axle, bearings in stationary frame plates support a rotating shaft, pulley and wheel. In the dead axle, the stationary shaft supports bearings carried by the rotating wheel assembly.</desc><rect width="640" height="470" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="34" font-size="23" text-anchor="start" font-weight="700">Live and dead axles</text><text x="610" y="34" font-size="17" text-anchor="end" >Red = rotating</text><text x="30" y="77" font-size="20" text-anchor="start" font-weight="700">Live axle</text><rect x="110" y="105" width="20" height="104" fill="#deddd7" stroke="#66655f" stroke-width="1.5" /><rect x="103" y="137" width="34" height="40" fill="#b7bdb7" stroke="#66655f" stroke-width="1.5" /><rect x="510" y="105" width="20" height="104" fill="#deddd7" stroke="#66655f" stroke-width="1.5" /><rect x="503" y="137" width="34" height="40" fill="#b7bdb7" stroke="#66655f" stroke-width="1.5" /><line x1="72" y1="157" x2="558" y2="157" stroke="#b82730" stroke-width="1.5"/><rect x="205" y="121" width="38" height="72" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /><rect x="330" y="100" width="74" height="114" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /><text x="122" y="236" font-size="17" text-anchor="middle" >Bearings in frame</text><line x1="122" y1="177" x2="122" y2="215" stroke="#77766f" stroke-width="1.5"/><text x="224" y="93" font-size="17" text-anchor="middle" >Pulley</text><line x1="224" y1="97" x2="224" y2="119" stroke="#77766f" stroke-width="1.5"/><text x="367" y="92" font-size="17" text-anchor="middle" >Wheel / hub</text><text x="472" y="236" font-size="17" text-anchor="middle" >Shaft turns</text><line x1="472" y1="164" x2="472" y2="214" stroke="#77766f" stroke-width="1.5"/><line x1="25" y1="257" x2="615" y2="257" stroke="#77766f" stroke-width="1.5"/><text x="30" y="293" font-size="20" text-anchor="start" font-weight="700">Dead axle</text><rect x="110" y="316" width="20" height="98" fill="#deddd7" stroke="#66655f" stroke-width="1.5" /><rect x="510" y="316" width="20" height="98" fill="#deddd7" stroke="#66655f" stroke-width="1.5" /><line x1="72" y1="365" x2="558" y2="365" stroke="#55554f" stroke-width="1.5"/><rect x="330" y="309" width="74" height="114" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /><rect x="294" y="329" width="32" height="72" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /><rect x="326" y="346" width="14" height="38" fill="#b7bdb7" stroke="#66655f" stroke-width="1.5" /><rect x="394" y="346" width="14" height="38" fill="#b7bdb7" stroke="#66655f" stroke-width="1.5" /><text x="175" y="448" font-size="17" text-anchor="middle" >Shaft stays fixed</text><line x1="175" y1="371" x2="175" y2="428" stroke="#77766f" stroke-width="1.5"/><text x="442" y="448" font-size="17" text-anchor="middle" >Bearings in wheel assembly</text><line x1="402" y1="385" x2="442" y2="425" stroke="#77766f" stroke-width="1.5"/><text x="295" y="315" font-size="17" text-anchor="end" >Pulley drives wheel</text></g></svg>
