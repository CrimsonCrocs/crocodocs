<svg xmlns="http://www.w3.org/2000/svg" width="600" height="440" viewBox="0 0 600 440" role="img" aria-labelledby="title desc"><title id="title">Funnel after lofting and shelling</title><desc id="desc">A funnel is 50 mm high, with outside inlet diameter 100 mm and outside outlet diameter 60 mm. A 2 mm inward shell leaves both ends open.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="440" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">Loft, then Shell</text><text x="30" y="76" font-size="19" text-anchor="start" >Axial section · outside profile dimensions</text><path d="M150 145L210 295L216.4621977685614 295L156.4621977685614 145Z M450 145L390 295L383.5378022314386 295L443.5378022314386 145Z" fill="#f4e5e4" stroke="#77766f" stroke-width="1.5"/><line x1="150" y1="108" x2="450" y2="108" stroke="#77766f" stroke-width="2" /><line x1="150" y1="102" x2="150" y2="114" stroke="#77766f" stroke-width="2" /><line x1="450" y1="102" x2="450" y2="114" stroke="#77766f" stroke-width="2" /><rect x="252" y="93" width="96" height="30" fill="#faf9f6"/><text x="300" y="115" font-size="21" text-anchor="middle" >Ø100</text><line x1="210" y1="348" x2="390" y2="348" stroke="#77766f" stroke-width="2" /><line x1="210" y1="342" x2="210" y2="354" stroke="#77766f" stroke-width="2" /><line x1="390" y1="342" x2="390" y2="354" stroke="#77766f" stroke-width="2" /><rect x="252" y="333" width="96" height="30" fill="#faf9f6"/><text x="300" y="355" font-size="21" text-anchor="middle" >Ø60</text><line x1="500" y1="145" x2="500" y2="295" stroke="#77766f" stroke-width="2" /><line x1="493" y1="145" x2="507" y2="145" stroke="#77766f" stroke-width="2" /><line x1="493" y1="295" x2="507" y2="295" stroke="#77766f" stroke-width="2" /><text x="523" y="227" font-size="21" text-anchor="start