<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Transfer arm position and orientation</title><desc id="desc">A 120 mm arm rotates through 90 degrees from 30 degrees below horizontal to 60 degrees above. The rectangular object rotates with it, arriving at an angled receiver with 2 mm nominal clearance per side.</desc><rect width="600" height="480" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="35" font-size="23" text-anchor="start" font-weight="700">Transfer poses</text><text x="30" y="65" font-size="17" text-anchor="start" >Practice object · dimensions in mm</text><line x1="50" y1="430" x2="555" y2="430" stroke="#77766f" stroke-width="1.5"/><line x1="70" y1="430" x2="70" y2="90" stroke="#77766f" stroke-width="1.5"/><text x="525" y="459" font-size="17" text-anchor="end" >Forward</text><line x1="166.0" y1="310.0" x2="290.70765814495917" y2="382.0" stroke="#b82730" stroke-width="1.5"/><g transform="translate(290.70765814495917 382.0) rotate(30)"><rect x="-24" y="-12" width="48" height="24" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /></g><line x1="166.0" y1="310.0" x2="238.0" y2="185.29234185504083" stroke="#b82730" stroke-width="1.5"/><g transform="translate(238.0 185.29234185504083) rotate(-60)"><rect x="-24" y="-12" width="48" height="24" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /></g><g transform="translate(238.0 185.29234185504083) rotate(-60)"><rect x="-26.4" y="-14.4" width="52.8" height="28.8" fill="none" stroke="#637669" stroke-width="1.5" /></g><circle cx="166.0" cy="310.0" r="5" fill="#292927" stroke="#292927" stroke-width="2"/><text x="102" y="284" font-size="17" text-anchor="start" >Pivot (80, 100)</text><line x1="155" y1="289" x2="166.0" y2="310.0" stroke="#77766f" stroke-width="1.5"/><path d="M290.70765814495917 382.0 A144 144 0 0 0 238.0 185.29234185504083" fill="none" stroke="#88867e" stroke-dasharray="6 4"/><text x="355" y="292" font-size="18" text-anchor="start" >90° sweep</text><text x="352" y="319" font-size="18" text-anchor="start" >120 mm arm</text><text x="318" y="124" font-size="18" text-anchor="start" >Handoff: (140, 203.9)</text><line x1="306" y1="131" x2="238.0" y2="185.29234185504083" stroke="#77766f" stroke-width="1.5"/><text x="322" y="164" font-size="18" text-anchor="start" >Object angle: 60°</text><text x="322" y="193" font-size="16" text-anchor="start" >2 mm nominal gap per side</text><text x="327" y="401" font-size="18" text-anchor="start" >Intake: (183.9, 40)</text><text x="327" y="424" font-size="18" text-anchor="start" >Object angle: −30°</text></g></svg>
