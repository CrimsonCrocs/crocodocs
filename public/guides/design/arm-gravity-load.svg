<svg xmlns="http://www.w3.org/2000/svg" width="600" height="490" viewBox="0 0 600 490" role="img" aria-labelledby="title desc"><title id="title">Two gravity loads on an arm</title><desc id="desc">A 0.4 kg arm has its center of mass 100 mm from the pivot. A 0.2 kg payload is 250 mm from it. Total static horizontal gravity torque is 0.883 newton meters.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="490" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">Gravity load on a horizontal arm</text><text x="30" y="76" font-size="19" text-anchor="start" >Use each mass and its center of mass</text><rect x="95" y="170" width="400" height="20" fill="#e6e2db" stroke="#77766f" stroke-width="1.5" /><circle cx="95" cy="180" r="8" fill="#faf9f6" stroke="#292927" stroke-width="2"/><rect x="477" y="157" width="36" height="46" fill="#f4e5e4" stroke="#77766f" stroke-width="1.5" /><text x="255" y="127" font-size="21" text-anchor="middle" >Arm: 0.4 kg</text><text x="470" y="127" font-size="21" text-anchor="middle" >Payload: 0.2 kg</text><line x1="255" y1="185" x2="255" y2="266" stroke="#b82730" stroke-width="2" marker-end="url(#arrow)"/><line x1="495" y1="185" x2="495" y2="266" stroke="#b82730" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="299" font-size="21" text-anchor="middle" >3.92 N</text><text x="495" y="299" font-size="21" text-anchor="middle" >1.96 N</text><line x1="95" y1="203" x2="95" y2="397" stroke="#77766f" stroke-width="2" /><line x1="255" y1="307" x2="255" y2="347" stroke="#77766f" stroke-width="2" /><line x1="495" y1="307" x2="495" y2="397" stroke="#77766f" stroke-width="2" /><line x1="95" y1="342" x2="255" y2="342" stroke="#77766f" stroke-width="2" /><line x1="95" y1="336" x2="95" y2="348" stroke="#77766f" stroke-width="2" /><line x1="255" y1="336" x2="255" y2="348" stroke="#77766f" stroke-width="2" /><rect x="127" y="327" width="96" height="30" fill="#faf9f6"/><text x="175" y="349" font-size="21" text-anchor="middle" >100 mm</text><line x1="95" y1="392" x2="495" y2="392" stroke="#77766f" stroke-width="2" /><line x1="95" y1="386" x2="95" y2="398" stroke="#77766f" stroke-width="2" /><line x1="495" y1="386" x2="495" y2="398" stroke="#77766f" stroke-width="2" /><rect x="247" y="377" width="96" height="30" fill="#faf9f6"/><text x="295" y="399" font-size="21" text-anchor="middle" >250 mm</text><text x="30" y="455" font-size="22" text-anchor="start" >Gravity torque: 0.392 + 0.491 = 0.883 N·m</text></g></svg>
