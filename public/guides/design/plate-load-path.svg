<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="title desc"><title id="title">Comparing connecting webs in a plate</title><desc id="desc">Two schematic plate profiles leave either 6 mm or 12 mm of material in the connecting web. At 3 mm thickness their direct-tension areas are 18 and 36 square millimeters.</desc><rect width="600" height="460" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="35" font-size="23" text-anchor="start" font-weight="700">Material left by a cutout</text><text x="30" y="65" font-size="17" text-anchor="start" >Same thickness: 3 mm · same example tension: 100 N</text><polygon points="160,90 252,90 252,158 348,158 348,90 440,90 440,250 348,250 348,182 252,182 252,250 160,250" fill="#e6e2db" stroke="#66655f" stroke-width="1.5"/><circle cx="220" cy="170" r="9" fill="#faf9f6" stroke="#b82730" stroke-width="2"/><circle cx="380" cy="170" r="9" fill="#faf9f6" stroke="#b82730" stroke-width="2"/><line x1="138" y1="170" x2="78" y2="170" stroke="#b82730" stroke-width="1.5"/><line x1="78" y1="170" x2="88" y2="164" stroke="#b82730" stroke-width="1.5"/><line x1="78" y1="170" x2="88" y2="176" stroke="#b82730" stroke-width="1.5"/><line x1="460" y1="170" x2="520" y2="170" stroke="#b82730" stroke-width="1.5"/><line x1="520" y1="170" x2="510" y2="164" stroke="#b82730" stroke-width="1.5"/><line x1="520" y1="170" x2="510" y2="176" stroke="#b82730" stroke-width="1.5"/><text x="300" y="135" font-size="19" text-anchor="middle" >6 mm web</text><text x="300" y="234" font-size="17" text-anchor="middle" >Area: 6 × 3 = 18 mm²</text><polygon points="160,270 252,270 252,326 348,326 348,270 440,270 440,430 348,430 348,374 252,374 252,430 160,430" fill="#e6e2db" stroke="#66655f" stroke-width="1.5"/><circle cx="220" cy="350" r="9" fill="#faf9f6" stroke="#b82730" stroke-width="2"/><circle cx="380" cy="350" r="9" fill="#faf9f6" stroke="#b82730" stroke-width="2"/><line x1="138" y1="350" x2="78" y2="350" stroke="#b82730" stroke-width="1.5"/><line x1="78" y1="350" x2="88" y2="344" stroke="#b82730" stroke-width="1.5"/><line x1="78" y1="350" x2="88" y2="356" stroke="#b82730" stroke-width="1.5"/><line x1="460" y1="350" x2="520" y2="350" stroke="#b82730" stroke-width="1.5"/><line x1="520" y1="350" x2="510" y2="344" stroke="#b82730" stroke-width="1.5"/><line x1="520" y1="350" x2="510" y2="356" stroke="#b82730" stroke-width="1.5"/><text x="300" y="315" font-size="19" text-anchor="middle" >12 mm web</text><text x="300" y="414" font-size="17" text-anchor="middle" >Area: 12 × 3 = 36 mm²</text></g></svg>
