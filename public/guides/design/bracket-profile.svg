<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500" role="img" aria-labelledby="title desc"><title id="title">L bracket sketch profile</title><desc id="desc">An L outline is 60 mm long and 40 mm high, with 4 mm legs. Extrude it symmetrically for a total width of 30 mm.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="500" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">Bracket side profile</text><text x="30" y="76" font-size="19" text-anchor="start" >Sketch first, then extrude across its width</text><path d="M110 370H470V346H134V130H110Z" fill="#e6e2db" stroke="#77766f" stroke-width="2"/><line x1="110" y1="377" x2="110" y2="420" stroke="#77766f" stroke-width="2" /><line x1="470" y1="377" x2="470" y2="420" stroke="#77766f" stroke-width="2" /><line x1="110" y1="414" x2="470" y2="414" stroke="#77766f" stroke-width="2" /><line x1="110" y1="408" x2="110" y2="420" stroke="#77766f" stroke-width="2" /><line x1="470" y1="408" x2="470" y2="420" stroke="#77766f" stroke-width="2" /><rect x="242" y="399" width="96" height="30" fill="#faf9f6"/><text x="290" y="421" font-size="21" text-anchor="middle" >60 mm</text><line x1="75" y1="130" x2="75" y2="370" stroke="#77766f" stroke-width="2" /><line x1="68" y1="130" x2="82" y2="130" stroke="#77766f" stroke-width="2" /><line x1="68" y1="370" x2="82" y2="370" stroke="#77766f" stroke-width="2" /><text x="54" y="250" font-size="21" text-anchor="middle" transform="rotate(-90 54 250)">40 mm</text><text x="194" y="166" font-size="22" text-anchor="start" >4 mm legs</text><line x1="183" y1="162" x2="134" y2="151" stroke="#77766f" stroke-width="2" /><line x1="375" y1="315" x2="425" y2="346" stroke="#77766f" stroke-width="2" /><text x="356" y="302" font-size="22" text-anchor="start" >4 mm</text><text x="30" y="470" font-size="22" text-anchor="start" >Extrusion width: 30 mm total</text></g></svg>
