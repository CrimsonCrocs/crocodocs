<svg xmlns="http://www.w3.org/2000/svg" width="600" height="510" viewBox="0 0 600 510" role="img" aria-labelledby="title desc"><title id="title">Shooter contact and tangent release layout</title><desc id="desc">A 96 mm wheel contacts a 70 mm ball with 5 mm nominal overlap. The ball center follows a 78 mm radius and exits at a geometric tangent 30 degrees above horizontal.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b82730"/></marker></defs><rect width="600" height="510" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="38" font-size="25" text-anchor="start" font-weight="700">A wheel, guide, and release path</text><text x="30" y="76" font-size="19" text-anchor="start" >Side-layout geometry · dimensions in mm</text><path d="M129.2197903737087 318.59999999999997A197.2 197.2 0 0 0 398.6 390.78020962629125L396.05 386.36348006699063A192.1 192.1 0 0 1 133.63651993300934 316.04999999999995Z" fill="#deddd7" stroke="#77766f" stroke-width="1.5"/><circle cx="300" cy="220" r="81.6" fill="#e6e2db" stroke="#77766f" stroke-width="2"/><text x="300" y="182" font-size="21" text-anchor="middle" >Ø96 wheel</text><circle cx="185.16503145818342" cy="286.29999999999995" r="59.5" fill="#f4e5e4" stroke="#b82730" stroke-width="2"/><circle cx="366.3" cy="334.8349685418166" r="59.5" fill="#f4e5e4" stroke="#b82730" stroke-width="2"/><path d="M185.16503145818342 286.29999999999995A132.6 132.6 0 0 0 366.3 334.8349685418166" fill="none" stroke="#77766f" stroke-width="2" stroke-dasharray="6 5"/><circle cx="185.16503145818342" cy="286.29999999999995" r="3" fill="#292927" stroke="#292927" stroke-width="2"/><circle cx="366.3" cy="334.8349685418166" r="3" fill="#292927" stroke="#292927" stroke-width="2"/><line x1="366.3" y1="334.8349685418166" x2="491.87368354874366" y2="262.3349685418166" stroke="#b82730" stroke-width="2" marker-end="url(#arrow)"/><text x="477" y="245" font-size="23" text-anchor="start" >30°</text><text x="30" y="197" font-size="21" text-anchor="start" >Ø70 ball</text><line x1="133" y1="205" x2="157" y2="239" stroke="#77766f" stroke-width="2" /><text x="418" y="402" font-size="20" text-anchor="start" >Exit center</text><text x="30" y="445" font-size="20" text-anchor="start" >Path radius: 78 · Guide inside radius: 113</text><text x="30" y="481" font-size="20" text-anchor="start" >5 mm nominal overlap · test the real contact</text></g></svg>
