<svg xmlns="http://www.w3.org/2000/svg" width="600" height="480" viewBox="0 0 600 480" role="img" aria-labelledby="title desc"><title id="title">Dimensioned drive layout</title><desc id="desc">Two 104 mm wheel envelopes have a 200 mm wheelbase. A 38 mm motor envelope has its axis 79.75 mm above the front wheel axis, using a 20-tooth to 40-tooth example belt drive.</desc><rect width="600" height="480" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="35" font-size="23" text-anchor="start" font-weight="700">Drive layout · side view</text><text x="30" y="65" font-size="17" text-anchor="start" >Construction envelopes · dimensions in mm</text><line x1="30" y1="380" x2="570" y2="380" stroke="#77766f" stroke-width="1.5"/><text x="545" y="370" font-size="17" text-anchor="end" >Floor</text><circle cx="130" cy="302" r="78" fill="#ece9e3" stroke="#77766f" stroke-width="2" stroke-dasharray="6 4"/><line x1="120" y1="302" x2="140" y2="302" stroke="#77766f" stroke-width="1.5"/><line x1="130" y1="292" x2="130" y2="312" stroke="#77766f" stroke-width="1.5"/><circle cx="430" cy="302" r="78" fill="#ece9e3" stroke="#77766f" stroke-width="2" stroke-dasharray="6 4"/><line x1="420" y1="302" x2="440" y2="302" stroke="#77766f" stroke-width="1.5"/><line x1="430" y1="292" x2="430" y2="312" stroke="#77766f" stroke-width="1.5"/><circle cx="130" cy="182.375" r="28.5" fill="#e4e8e5" stroke="#637669" stroke-width="2"/><circle cx="130" cy="182.375" r="9.549296585513721" fill="none" stroke="#b82730" stroke-width="2"/><circle cx="130" cy="302" r="19.098593171027442" fill="none" stroke="#b82730" stroke-width="2"/><line x1="120.45" y1="182.375" x2="110.9" y2="302" stroke="#b82730" stroke-width="1.5"/><line x1="139.55" y1="182.375" x2="149.1" y2="302" stroke="#b82730" stroke-width="1.5"/><text x="196" y="151" font-size="18" text-anchor="start" >Motor envelope: Ø38</text><line x1="159" y1="182.375" x2="190" y2="156" stroke="#77766f" stroke-width="1.5"/><text x="215" y="204" font-size="18" text-anchor="start" >20T driver</text><line x1="140" y1="182.375" x2="204" y2="199" stroke="#77766f" stroke-width="1.5"/><text x="215" y="251" font-size="18" text-anchor="start" >40T driven</text><line x1="150" y1="291" x2="205" y2="256" stroke="#77766f" stroke-width="1.5"/><line x1="35" y1="182.375" x2="35" y2="302" stroke="#77766f" stroke-width="1.5"/><line x1="29" y1="182.375" x2="41" y2="182.375" stroke="#77766f" stroke-width="1.5"/><line x1="29" y1="302" x2="41" y2="302" stroke="#77766f" stroke-width="1.5"/><text x="21" y="242" font-size="18" text-anchor="middle" transform="rotate(-90 21 242)">79.75</text><line x1="130" y1="420" x2="430" y2="420" stroke="#77766f" stroke-width="1.5"/><line x1="130" y1="415" x2="130" y2="425" stroke="#77766f" stroke-width="1.5"/><line x1="430" y1="415" x2="430" y2="425" stroke="#77766f" stroke-width="1.5"/><rect x="256.0" y="408" width="48" height="25" fill="#faf9f6"/><text x="280.0" y="426" font-size="18" text-anchor="middle" >200</text><line x1="130" y1="382" x2="130" y2="428" stroke="#77766f" stroke-width="1.5"/><line x1="430" y1="382" x2="430" y2="428" stroke="#77766f" stroke-width="1.5"/><text x="430" y="292" font-size="19" text-anchor="middle" >Ø104</text><text x="300" y="464" font-size="17" text-anchor="middle" >Wheel centers: (80, 52) and (280, 52)</text></g></svg>
