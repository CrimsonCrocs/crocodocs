<svg xmlns="http://www.w3.org/2000/svg" width="640" height="355" viewBox="0 0 640 355" role="img" aria-labelledby="title desc"><title id="title">Hyperion transfer angle concept</title><desc id="desc">A teaching sketch shows a game object already at 60 degrees, then lifted and extended while keeping that orientation to match the scoring surface. This explains the team’s stated decision to avoid a separate pitch motion.</desc><rect width="640" height="355" rx="14" fill="#faf9f6"/><g font-family="Arial, sans-serif" fill="#292927"><text x="30" y="35" font-size="23" text-anchor="start" font-weight="700">Keep the required object angle</text><text x="30" y="65" font-size="17" text-anchor="start" >Teaching sketch from Hyperion’s explanation</text><line x1="450" y1="285" x2="574" y2="70" stroke="#66655f" stroke-width="1.5"/><text x="606" y="315" font-size="17" text-anchor="end" >Scoring surface</text><g transform="translate(160 230) rotate(-60)"><rect x="-35" y="-7" width="70" height="14" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /></g><g transform="translate(492 190) rotate(-60)"><rect x="-35" y="-7" width="70" height="14" fill="#f4e5e4" stroke="#b82730" stroke-width="1.5" /></g><line x1="160" y1="182" x2="160" y2="122" stroke="#b82730" stroke-width="1.5"/><line x1="160" y1="122" x2="415" y2="122" stroke="#b82730" stroke-width="1.5"/><line x1="415" y1="122" x2="404" y2="116" stroke="#b82730" stroke-width="1.5"/><line x1="415" y1="122" x2="404" y2="128" stroke="#b82730" stroke-width="1.5"/><text x="30" y="293" font-size="18" text-anchor="start" >Transfer at 60°</text><text x="230" y="107" font-size="18" text-anchor="start" >Lift and extend</text><text x="253" y="170" font-size="18" text-anchor="start" >Angle stays 60°</text><text x="30" y="336" font-size="16" text-anchor="start" >Illustrates orientation only · not the team’s mechanism geometry</text></g></svg>
